version: 0.2

phases:
  build:
    commands:
      - echo "Running tests..."

      # 1️⃣ 检查 index.html 是否存在
      - test -f index.html || (echo "index.html missing" && exit 1)
      
      # 3️⃣ 检查 JSON 非空（可选）
      - test -s data/processed/ccf.json || (echo "Empty JSON file" && exit 1)
      
      # 2️⃣ 检查 JSON 是否合法
      - jq . data/processed/ccf.json > /dev/null || (echo "Invalid JSON" && exit 1)

      - echo "All tests passed ✅"